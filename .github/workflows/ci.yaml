name: CI Quality & Test Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: annapoorna_user
          POSTGRES_PASSWORD: annapoorna_secure_password
          POSTGRES_DB: annapoorna_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: ./apps/api
        run: |
          uv sync --dev

      - name: Lint with Ruff
        working-directory: ./apps/api
        run: |
          uv run ruff check .

      - name: Format Check with Ruff
        working-directory: ./apps/api
        run: |
          uv run ruff format --check .

      - name: Type Check with MyPy
        working-directory: ./apps/api
        run: |
          uv run mypy app

      - name: Run Pytest Test Suite
        working-directory: ./apps/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://annapoorna_user:annapoorna_secure_password@localhost:5432/annapoorna_test_db
          REDIS_URL: redis://localhost:6379/0
          APP_SECRET_KEY: test-secret-key-32-chars-minimum-length
          JWT_SECRET_KEY: test-jwt-secret-key-32-chars-min
        run: |
          uv run pytest tests -v --cov=app

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Frontend Lint
        working-directory: ./apps/web
        run: npm run lint

      - name: Frontend Build
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
